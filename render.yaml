# Render Blueprint — backend FastAPI. Xem DEPLOY.md §3.
# Import: Render Dashboard → New → Blueprint → chọn repo này.
services:
  - type: web
    name: superego-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_OFFLINE
        value: "false"
      - key: OVERLAY_BACKEND
        value: supabase
      - key: OVERLAY_TTL_SECONDS
        value: "86400"
      # --- Điền ở Dashboard (đừng commit giá trị thật) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS          # https://<app>.vercel.app — điền sau khi deploy frontend
        sync: false
