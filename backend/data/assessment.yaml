# Ánh xạ band theo điểm trung bình (Tổng ÷ 10). Xem docx/06 §2.3.
bands:
  - id: THAP
    label: "Mức thấp"
    min: 1.00
    max: 2.00
    headline: "Bạn đang có ít biểu hiện liên quan đến Cái siêu tôi trừng phạt"
    result_text: |
      Bạn nhìn chung không quá khắt khe với bản thân. Khi mắc lỗi hoặc không
      đạt được kỳ vọng, bạn vẫn có khả năng nhìn nhận sai sót và tiếp tục cố
      gắng mà không tự trách mình quá mức.

      Điều này có thể biểu hiện qua việc:
      • Bạn có thể chấp nhận rằng mình đôi khi mắc lỗi.
      • Bạn không thường xuyên cảm thấy mình "chưa đủ tốt".
      • Bạn có khả năng ghi nhận cả những điều mình đã làm tốt.
      • Những thất bại không thường khiến bạn đánh giá tiêu cực về bản thân.

      Bạn có thể làm gì tiếp theo? Hãy duy trì cách nhìn cân bằng này. Khi mắc
      lỗi, tiếp tục tập trung vào câu hỏi "Mình có thể học được gì từ chuyện
      này?" thay vì chỉ tập trung vào việc "Mình đã làm sai ở đâu?"

  - id: NHE
    label: "Mức nhẹ"
    min: 2.01
    max: 3.00
    headline: "Một số biểu hiện đáng chú ý đang xuất hiện"
    result_text: |
      Bạn đôi khi có xu hướng tự trách, đặt kỳ vọng cao hoặc cảm thấy chưa hài
      lòng với bản thân. Tuy nhiên, những biểu hiện này chưa xuất hiện thường
      xuyên hoặc chưa chi phối mạnh cách bạn nhìn nhận bản thân.

      Bạn có thể đang:
      • Tự trách khi mắc lỗi.
      • Cảm thấy thất vọng khi không đạt mục tiêu.
      • Đôi khi so sánh bản thân với người khác.
      • Đặt ra những tiêu chuẩn khá cao cho chính mình.

      Bạn nên làm gì? Đây là thời điểm phù hợp để bắt đầu nhận diện cách bạn
      nói chuyện với chính mình. Đặc biệt, hãy chú ý xem liệu việc tự phê bình
      có giúp bạn cải thiện hay chỉ khiến bạn cảm thấy tệ hơn.

  - id: DANG_CHU_Y
    label: "Mức đáng chú ý"
    min: 3.01
    max: 4.00
    headline: "Bạn đang có khá nhiều biểu hiện liên quan"
    result_text: |
      Bạn đang ghi nhận khá nhiều đặc điểm thường liên quan đến Cái siêu tôi
      trừng phạt, chẳng hạn như tự phê bình, khó chấp nhận sai sót, đặt tiêu
      chuẩn cao hoặc cảm thấy mình chưa đủ tốt dù đã cố gắng. Điều đáng chú ý
      không chỉ là bạn đã mắc lỗi gì, mà còn là cách bạn đối xử với chính mình
      sau khi mắc lỗi.

      Bạn có thể đang trải qua một vòng lặp như: Đặt kỳ vọng cao → Không đạt
      kỳ vọng → Tự phê bình → Cảm thấy chưa đủ tốt → Tiếp tục đặt áp lực lên
      bản thân.

      Bạn nên làm gì? Đừng vội cố gắng trở nên "hoàn hảo" hơn. Trước tiên, hãy
      học cách nhận diện những suy nghĩ quá khắt khe với bản thân và phân biệt
      chúng với những phản hồi thực sự giúp bạn tiến bộ.

  - id: CAO
    label: "Mức cao"
    min: 4.01
    max: 5.00
    headline: "Các biểu hiện liên quan đang khá rõ"
    result_text: |
      Bạn đang ghi nhận nhiều biểu hiện mạnh liên quan đến Cái siêu tôi trừng
      phạt. Bạn có thể thường xuyên tự phê bình, khó tha thứ cho những sai sót
      của mình hoặc cảm thấy bản thân chưa bao giờ đạt đến mức "đủ tốt".

      Những biểu hiện này không có nghĩa bạn "mắc" Cái siêu tôi trừng phạt hay
      đang gặp một rối loạn tâm lý. Bài đánh giá chỉ giúp bạn nhận diện mức độ
      của những đặc điểm này ở bản thân.

      Điều đáng chú ý là: nếu một lỗi sai nhỏ cũng khiến bạn suy nghĩ tiêu cực
      về bản thân, hoặc những yêu cầu bạn đặt ra cho chính mình trở thành
      nguồn áp lực thường xuyên, bạn nên dành thời gian quan sát và điều chỉnh
      cách mình đối xử với bản thân.

      Bạn nên làm gì tiếp theo?
      Bắt đầu với những cách đơn giản để: nhận diện suy nghĩ tự phê bình; phân
      biệt tự phê bình với tự đánh giá để cải thiện; chấp nhận rằng sai sót là
      một phần bình thường của quá trình học tập; thiết lập những kỳ vọng thực
      tế hơn; học cách nhìn nhận cả những điều mình đã làm tốt.

      Nếu những cảm xúc hoặc suy nghĩ tiêu cực kéo dài, xuất hiện thường xuyên
      hoặc ảnh hưởng rõ rệt đến học tập, sinh hoạt, các mối quan hệ hoặc khả
      năng chăm sóc bản thân, bạn nên tìm đến một người lớn đáng tin cậy hoặc
      chuyên gia tâm lý để được hỗ trợ phù hợp.

