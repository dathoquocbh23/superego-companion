# liệu tử vong/tự sát · các câu xưng "cho nghiên cứu của bạn" / "Trích dẫn
# học thuật" / "Câu có thể dùng trong bài nghiên cứu".

lo-au-tong-quan:
  title: "Rối loạn lo âu phổ biến thế nào"
  body: |
    Những điểm chính:
    • Rối loạn lo âu là nhóm rối loạn tâm thần phổ biến nhất trên thế giới,
      với khoảng 359 triệu người mắc vào năm 2021.
    • Nữ giới bị ảnh hưởng nhiều hơn nam giới.
    • Các triệu chứng lo âu thường khởi phát từ thời thơ ấu hoặc tuổi vị thành niên.
    • Hiện nay đã có nhiều phương pháp điều trị hiệu quả cao cho rối loạn lo âu.
    • Tuy nhiên, chỉ khoảng 1/4 số người mắc được tiếp cận điều trị.

    Khoảng 4,4% dân số thế giới đang trải qua một dạng rối loạn lo âu. Vào năm
    2021, có khoảng 359 triệu người mắc, khiến đây trở thành nhóm rối loạn tâm
    thần phổ biến nhất hiện nay.

    Khoảng 1/3 thanh thiếu niên và người trưởng thành tại Hoa Kỳ sẽ trải qua
    ít nhất một rối loạn lo âu trong suốt cuộc đời. Các triệu chứng lo âu có
    thể ảnh hưởng đáng kể đến cuộc sống thường ngày, kết quả học tập, hiệu
    suất làm việc và các mối quan hệ xã hội. Trong những trường hợp nghiêm
    trọng, người bệnh có thể cảm thấy sợ hãi dữ dội trong các tình huống thông
    thường, né tránh giao tiếp xã hội, hoặc từ chối rời khỏi nhà.

    Mặc dù có nhiều phương pháp điều trị hiệu quả, chỉ khoảng 27,6% người cần
    hỗ trợ thực sự nhận được điều trị. Các rào cản chính bao gồm: thiếu nhận
    thức rằng đây là tình trạng có thể điều trị; thiếu đầu tư cho dịch vụ sức
    khỏe tinh thần; thiếu nhân lực chuyên môn; kỳ thị xã hội đối với các vấn
    đề tâm lý.
  steer: |
    Thẻ số liệu + rào cản. Hai ý để lại sau khi đọc: (1) lo âu rất phổ biến —
    người dùng KHÔNG đơn độc, KHÔNG có gì đáng xấu hổ; (2) đa số người mắc
    không được hỗ trợ, phần vì kỳ thị — nên tìm hỗ trợ là việc bình thường.

    Đọc lướt phần số. KHÔNG dùng "1/3 thanh thiếu niên" để nói người dùng "có
    khả năng cao bị". Nói về hiện tượng chung, không về họ.
  source: "RỐI LOẠN LO ÂU & TRẦM CẢM.docx — WHO \"Những điểm chính\" / \"Tỷ lệ mắc\" / \"Các rào cản điều trị\" + NIMH \"Tại sao NIMH nghiên cứu rối loạn lo âu\""

lo-au-yeu-to-phong-ngua:
  title: "Vì sao có người bị rối loạn lo âu"
  body: |
    Rối loạn lo âu hình thành từ sự tương tác phức tạp giữa các yếu tố sinh
    học, tâm lý và xã hội. Nguy cơ tăng cao ở những người từng trải qua: bạo
    hành; mất mát lớn; trải nghiệm bất lợi kéo dài.

    Các yếu tố môi trường được quan tâm gồm môi trường gia đình, các trải
    nghiệm thời thơ ấu và các yếu tố xã hội — chúng có thể làm tăng hoặc giảm
    nguy cơ ở trẻ em, thanh thiếu niên và người trưởng thành. Một số giai đoạn
    chuyển tiếp có nguy cơ cao xuất hiện lo âu, chẳng hạn như chuyển tiếp từ
    trung học lên đại học. Ảnh hưởng của mạng xã hội đối với sức khỏe tinh
    thần của thanh thiếu niên cũng là một chủ đề được nghiên cứu rộng rãi. Lo
    âu cũng thường chồng lấp với các vấn đề tâm lý khác như trầm cảm và rối
    loạn ăn uống.

    Các biện pháp phòng ngừa hiệu quả bao gồm: giáo dục cha mẹ; chương trình
    kỹ năng cảm xúc – xã hội trong trường học; rèn luyện khả năng ứng phó tích
    cực; tập thể dục thường xuyên.
  steer: |
    Cùng thông điệp với thẻ trầm cảm tương ứng: KHÔNG một nguyên nhân duy
    nhất, nhiều yếu tố tương tác. "Chuyển tiếp từ trung học lên đại học" và
    "mạng xã hội" là hai chỗ gần với học sinh — nếu người dùng vừa nhắc tới,
    dùng đúng chỗ đó. KHÔNG nói người dùng "có yếu tố nguy cơ".
  source: "RỐI LOẠN LO ÂU & TRẦM CẢM.docx — WHO \"Các yếu tố góp phần gây lo âu\" / \"Phòng ngừa\" + NIMH \"Các yếu tố môi trường\" / \"Các giai đoạn chuyển tiếp\""

lo-au-dieu-tri:
  title: "Rối loạn lo âu có chữa được không"
  body: |
    Điều trị hiệu quả nhất hiện nay là liệu pháp tâm lý, đặc biệt là Liệu
    pháp Nhận thức – Hành vi (CBT). Các kỹ thuật quan trọng gồm:
    • Nhận diện và thay đổi suy nghĩ tiêu cực.
    • Đối diện dần với nỗi sợ.
    • Kỹ năng thư giãn.
    • Chánh niệm (mindfulness).
  steer: |
    Câu trả lời là CÓ, và bước đầu là liệu pháp tâm lý (CBT), không phải
    thuốc. Bốn kỹ thuật ở đây là để HIỂU trị liệu gồm những gì, KHÔNG phải để
    người dùng tự làm CBT một mình. Nếu họ hỏi vì lo cho mình, chuyển sang chủ
    đề 4. KHÔNG kê thuốc.
  source: "RỐI LOẠN LO ÂU & TRẦM CẢM.docx — WHO \"Điều trị\" (rối loạn lo âu; lược tên thuốc)"

tram-cam-nguyen-nhan:
  title: "Trầm cảm do đâu mà có"
  body: |
    Trầm cảm không có một nguyên nhân đơn lẻ. Có nhiều yếu tố góp phần làm
    tăng nguy cơ một người sẽ xuất hiện bệnh lý này, bao gồm: gen di truyền;
    tương tác hóa học trong não; một số bệnh lý y khoa nhất định; sử dụng
    chất; căng thẳng; dinh dưỡng kém. Không một nguyên nhân đơn lẻ nào có thể
    độc lập gây trầm cảm — di truyền có thể làm tăng nguy cơ, còn môi trường
    tác động vào và xác định mức độ nguy cơ.

    Tiền sử gia đình và di truyền. Nếu có người trong gia đình mắc trầm cảm
    hoặc một rối loạn khí sắc khác, bạn dễ xuất hiện các triệu chứng trầm cảm
    hơn. Ước tính trầm cảm bị tác động khoảng 40% từ di truyền; có cha mẹ hoặc
    ông bà mắc trầm cảm làm tăng nguy cơ gấp hai lần.

    Não bộ và cơ thể. Một nguyên nhân sinh học tiềm ẩn là mất cân bằng các
    chất dẫn truyền thần kinh liên quan đến điều tiết tâm trạng (như dopamine,
    serotonin, norepinephrine). Cách giải thích này thường được nhắc tới nhưng
    vẫn chưa được kiểm chứng đầy đủ và nhiều chuyên gia cho rằng nó chưa thể
    hiện bức tranh đầy đủ. Bạn cũng dễ xuất hiện triệu chứng trầm cảm hơn nếu
    có một bệnh lý mãn tính, rối loạn giấc ngủ hoặc bệnh lý tuyến giáp; tỷ lệ
    trầm cảm cũng cao hơn ở người bị đau mãn tính, tiểu đường, bệnh đa xơ cứng
    và ung thư.

    Hormone. Phụ nữ mắc trầm cảm điển hình cao hơn khoảng hai lần so với nam
    giới, và người ta tin rằng yếu tố hormone có thể góp phần. Phụ nữ đặc biệt
    dễ mắc trong những giai đoạn hormone biến động như quanh kỳ kinh, mang
    thai, sinh con và tiền mãn kinh.

    Lối sống. Đây là nhóm yếu tố con người có nhiều quyền kiểm soát hơn:
    • Nhịp sinh học: một dạng trầm cảm theo mùa được cho là do rối loạn nhịp
      sinh học khi ngày mùa đông ngắn, ít ánh sáng. Trị liệu ánh sáng, ra
      ngoài trời nhiều hơn, ăn lành mạnh và tập thể dục có thể giúp ích.
    • Dinh dưỡng: thiếu hụt vitamin và khoáng chất, chế độ ăn nhiều đường, và
      chế độ ăn thiếu acid béo omega-3 đều có liên đới với trầm cảm.
    • Căng thẳng: các sự kiện gây căng thẳng vượt quá khả năng ứng phó có thể
      là một nguyên nhân; nồng độ cortisol cao khi căng thẳng có thể ảnh hưởng
      lên serotonin.
    • Đau buồn và mất mát: sau khi mất người thân, người ở lại thường khó ngủ,
      chán ăn, mất hứng thú — là phản ứng bình thường; nhưng khi các triệu
      chứng ngày càng nặng, nỗi đau buồn có thể biến thành trầm cảm.
    • Sử dụng chất: ma túy và rượu có thể góp phần gây rối loạn trầm cảm; một
      số thuốc kê toa cũng có liên đới, nên trao đổi với bác sĩ nếu bạn cảm
      thấy trầm cảm.
  steer: |
    Thẻ DÀI, liệt kê nhiều nhóm nguyên nhân. Mục đích DUY NHẤT: cho thấy trầm
    cảm là kết quả của NHIỀU yếu tố, KHÔNG phải lỗi hay sự yếu đuối của người
    mắc. Đây là hàng rào chống tự trách.

    KHÔNG đọc cả thẻ như một bài giảng. Nếu người dùng vừa nhắc tới một yếu tố
    (mất ngủ, mất người thân, ăn uống thất thường…), chỉ lấy đúng đoạn đó, rồi
    quay về chuyện của họ. KHÔNG nói người dùng "có mấy yếu tố nguy cơ rồi".
    KHÔNG bàn thuốc.
  source: "RỐI LOẠN LO ÂU & TRẦM CẢM.docx — \"Nguyên nhân gây trầm cảm phổ biến\" (lược bản dịch tiếng Anh, dòng \"Nguồn: …\", tên thuốc cụ thể)"

sieu-toi-phan-tam:
  title: "Góc nhìn phân tâm học về siêu tôi trừng phạt"
  body: |
    APA định nghĩa superego là thành phần đạo đức của nhân cách, đại diện cho
    các chuẩn mực của cha mẹ và xã hội; nó góp phần hình thành các tiêu chuẩn
    cá nhân về đúng – sai và tiếp tục phát triển trong thời thơ ấu, vị thành
    niên và trưởng thành. Đặc biệt, APA định nghĩa "superego sadism" là khía
    cạnh hung hăng, cứng nhắc và trừng phạt của Siêu tôi.

    Nghiên cứu tâm lý phân tâm học mô tả "sự tự phê phán vô thức mang tính
    trừng phạt" và liên hệ nó với những trạng thái cảm xúc đau khổ như tội
    lỗi, xấu hổ, nhục nhã và trầm cảm. Nghiên cứu của Sidney Blatt về các kiểu
    trầm cảm phân biệt một dạng "trầm cảm mang tính hướng nội / tự phê phán",
    trong đó cảm giác thua kém bản thân gắn với một Siêu tôi khắc nghiệt và
    trừng phạt.
  steer: |
    Thẻ này bổ sung nền lý thuyết cho thẻ mở đầu: không chỉ WHO, mà cả phân
    tâm học cũng nối siêu tôi khắc nghiệt với tự phê phán và trầm cảm.

    Thuật ngữ ("superego sadism", "introjective depression") là để bot HIỂU,
    KHÔNG phải để nói với người dùng. Với họ, vẫn là: "một tiêu chuẩn nội tâm
    quá khắt khe có thể khiến người ta tự phê phán tới mức đau khổ". KHÔNG dán
    nhãn.
  source: "RỐI LOẠN LO ÂU & TRẦM CẢM.docx — \"Và nghiên cứu tâm lý phân tâm học cũng ủng hộ mối liên hệ này\" (lược tên tạp chí)"
