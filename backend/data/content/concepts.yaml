id-ego-superego:
  title: "Id – Ego – Superego: ba thành tố trong mô hình của Freud"
  body: |
    Theo Sigmund Freud, tâm lý con người có thể được nhìn nhận thông qua ba
    thành tố: Id, Ego và Superego. Có thể hiểu đơn giản đây là ba cách phản
    ứng khác nhau bên trong mỗi người khi chúng ta đứng trước một tình huống.

    Id – Cái ấy: "Mình muốn!"
    Id là phần liên quan đến những mong muốn, nhu cầu và cảm xúc bản năng. Nó
    thường muốn điều mình thích được đáp ứng ngay lập tức, mà không suy nghĩ
    quá nhiều về hậu quả. Nói đơn giản, Id giống như một tiếng nói bên trong:
    "Mình muốn làm điều này!" Ví dụ: Ngày mai có bài kiểm tra nhưng hôm nay
    bạn rất muốn chơi game. → Id: "Chơi một chút đi, học sau cũng được!" Id
    không nhất thiết là "xấu". Nó giúp chúng ta nhận biết mình đang muốn gì,
    cần gì và cảm thấy như thế nào.

    Ego – Cái tôi: "Mình nên làm gì?"
    Ego là phần giúp chúng ta nhìn vào tình hình thực tế và cân nhắc trước khi
    hành động. Thay vì chỉ làm theo mong muốn hoặc cảm xúc, Ego xem xét: Điều
    gì có thể thực hiện được? Điều gì phù hợp với hoàn cảnh hiện tại? Có thể
    hình dung Ego như tiếng nói: "Mình muốn như vậy, nhưng trong hoàn cảnh này
    thì mình nên làm gì?" Ví dụ: → Id: "Chơi đi!" → Ego: "Mình có thể học
    trước một tiếng rồi chơi sau." Ego giúp chúng ta cân bằng giữa mong muốn
    của bản thân và thực tế.

    Superego – Cái siêu tôi: "Mình phải làm đúng!"
    Superego liên quan đến những quy tắc, giá trị, chuẩn mực và kỳ vọng mà
    chúng ta dần hình thành trong quá trình lớn lên. Những điều này có thể đến
    từ gia đình, nhà trường, xã hội và chính những tiêu chuẩn mà chúng ta đặt
    ra cho bản thân. Nói đơn giản, Superego giống như một tiếng nói nhắc nhở:
    "Điều này có đúng không?", "Mình có nên làm như vậy không?", "Mình phải
    trở thành người như thế nào?" Ví dụ: → Id: "Mình muốn chơi!" → Ego: "Học
    trước rồi chơi sau." → Superego: "Mình phải học thật tốt. Không được lãng
    phí thời gian!" Superego giúp chúng ta biết đúng – sai, hình thành nguyên
    tắc và hướng đến những điều mình cho là tốt đẹp.

    Vậy ba thành tố khác nhau như thế nào? Có thể nhớ rất đơn giản:
    Id → "Mình muốn!"
    Ego → "Mình có thể làm gì?"
    Superego → "Mình nên / phải làm gì?"

    Trong cuộc sống, ba thành tố này có thể cùng xuất hiện và đôi khi không
    cùng muốn một điều. Khi đó, chúng ta có thể cảm thấy giằng co hoặc mâu
    thuẫn trong lòng.

    Đặc biệt, Superego không phải lúc nào cũng tiêu cực. Vấn đề có thể xuất
    hiện khi những tiêu chuẩn và yêu cầu dành cho bản thân trở nên quá khắt
    khe, khiến một người thường xuyên tự trách, khó tha thứ cho bản thân hoặc
    cảm thấy mình chưa bao giờ đủ tốt. Đây là điểm dẫn đến khái niệm Cái siêu
    tôi trừng phạt (Punitive Superego).
  steer: |
    Ba tiếng nói bên trong: Id "mình muốn", Ego "mình có thể làm gì", Superego
    "mình phải làm gì". Khi người dùng nói bằng giọng PHẢI / NÊN / ĐÁNG LẼ, đó
    là Superego đang cầm mic. Hỏi vào chính chỗ đó: tiêu chuẩn ấy ở đâu ra, ai
    đặt nó.

    Về việc gọi tên khái niệm (sửa 09/09/2026 — bản cũ cấm nhầm cả thẻ):
    THẺ NÀY được phép nêu đủ Id / Ego / Superego — nó là tài liệu, có nguồn.
    Câu BẠN TỰ VIẾT thì không gọi tên khái niệm ra để mô tả người dùng: nói
    "điều bạn vừa kể trùng với biểu hiện tài liệu mô tả", không nói "bạn đang
    có Siêu tôi trừng phạt". Nêu khái niệm được, dán nhãn lên người thì không.
  source: "HIỂU VỀ CÁI SIÊU TÔI TRỪNG PHẠT.docx — mục 2"

lanh-manh-vs-trung-phat:
  title: "Phân biệt Superego lành mạnh và Superego trừng phạt"
  body: |
    Đây là điểm quan trọng nhất để nhận diện Cái siêu tôi trừng phạt.

    Theo tài liệu nghiên cứu, Superego lành mạnh có xu hướng hỗ trợ, đánh giá
    bản thân thực tế, khuyến khích nhận biết cảm xúc và đối diện với thất bại
    bằng hành động mang tính xây dựng. Ngược lại, Superego trừng phạt duy trì
    mối quan hệ nội tâm cứng nhắc, thiếu yêu thương và có xu hướng quở trách,
    làm xấu hổ bản thân.

    Cái siêu tôi lành mạnh — Cái siêu tôi trừng phạt
    • Đặt ra tiêu chuẩn thực tế — Đặt tiêu chuẩn quá cao hoặc cứng nhắc
    • Nhận ra sai lầm để sửa chữa — Tập trung vào việc tự trách vì sai lầm
    • Có thể chấp nhận thất bại — Khó chấp nhận thất bại
    • Khuyến khích bản thân tiến bộ — Khiến bản thân cảm thấy chưa bao giờ đủ tốt
    • Quan tâm đến cảm xúc của bản thân — Có xu hướng phớt lờ hoặc dồn nén cảm xúc
    • Có thể tha thứ cho sai sót — Khó tha thứ cho chính mình
    • Thất bại → học hỏi và điều chỉnh — Thất bại → xấu hổ, tự phê bình và hạ thấp bản thân
    • "Mình làm chưa tốt, lần sau mình sẽ cải thiện." — "Mình làm chưa tốt vì mình không đủ giỏi."
  steer: |
    Khác biệt KHÔNG nằm ở chuyện có tiêu chuẩn cao hay không, mà ở chỗ sai lầm
    dẫn tới đâu: SỬA CHỮA (lành mạnh) hay TRỪNG PHẠT BẢN THÂN (trừng phạt).
    Đối chiếu: "mình làm chưa tốt, lần sau cải thiện" — "mình làm chưa tốt VÌ
    mình không đủ giỏi". Nghe xem người dùng đang ở vế nào, rồi hỏi cho rõ vế
    đó. Đừng đọc ra hai vế này như bảng so sánh.
  source: "HIỂU VỀ CÁI SIÊU TÔI TRỪNG PHẠT.docx — mục 5"

nhan-dien-hang-ngay:
  title: "Nhận diện trong đời sống hằng ngày"
  body: |
    Có thể nhận diện thông qua một số câu hỏi:

    Khi mắc lỗi, tôi phản ứng như thế nào?
    • Bình thường: "Mình đã sai ở đâu? Mình có thể sửa như thế nào?"
    • Có xu hướng trừng phạt: "Tại sao mình lại ngu ngốc như vậy?"

    Khi không đạt mục tiêu?
    • Bình thường: "Kết quả chưa tốt, nhưng mình có thể thử lại."
    • Có xu hướng trừng phạt: "Mình không được phép thất bại."

    Khi được người khác khen?
    • Bình thường: "Mình đã làm tốt điều này."
    • Có xu hướng trừng phạt: "Chắc mình chỉ may mắn thôi. Mình vẫn chưa đủ tốt."

    Như vậy, không phải cứ tự phê bình hay đặt mục tiêu cao là có Cái siêu tôi
    trừng phạt. Điều cần chú ý là mức độ cứng nhắc, kéo dài và mang tính tự
    trừng phạt trong cách cá nhân đánh giá chính mình.
  steer: |
    Ba câu hỏi soi gương, mỗi câu hai vế đối nhau. Thẻ này khác các thẻ khác ở
    chỗ nó KHÔNG kết thúc bằng một kết luận — nó kết thúc bằng một câu hỏi bỏ
    ngỏ cho người đọc. Sau khi thẻ hiện ra, việc của bạn là hỏi họ NHẬN RA MÌNH
    Ở VẾ NÀO, bằng đúng ba tình huống trên chứ không bịa tình huống thứ tư:
    lúc mắc lỗi, lúc không đạt mục tiêu, lúc được khen.

    Họ chọn vế phải thì KHÔNG chốt hạ ("vậy là bạn có Siêu tôi trừng phạt") —
    câu cuối của thẻ đã nói rõ điều cần chú ý là MỨC ĐỘ cứng nhắc và kéo dài,
    không phải một lần trả lời. Hỏi tiếp về mức độ, đừng dán nhãn.
  source: "HIỂU VỀ CÁI SIÊU TÔI TRỪNG PHẠT.docx — mục 6"

vong-lap-tu-phe-phan:
  title: "Khi tự phê phán chuyển thành một vòng lặp khó thoát"
  body: |
    Tiêu chuẩn quá khắt khe
     → Không đạt tiêu chuẩn
     → Tự phê phán
     → Tội lỗi / xấu hổ
     → Cảm thấy bản thân kém giá trị
     → Căng thẳng
     → Càng cố gắng hoàn hảo
     → Lại tự phê phán

    Khi một người không còn tự mình phá vỡ được vòng lặp này, đó là lúc tìm
    kiếm sự hỗ trợ trở nên phù hợp.
  steer: |
    Vòng lặp: tiêu chuẩn khắt khe -> không đạt -> tự trách -> tự tin giảm ->
    càng dễ không đạt. Người đang ở trong vòng KHÔNG thấy vòng; họ chỉ thấy
    lỗi của mình lặp đi lặp lại và tin đó là bằng chứng về con người mình.
    Việc của bot là cho họ thấy TRÌNH TỰ, bằng chính lời họ đã nói ra.
  source: "KHI NÀO CẦN TÌM HỖ TRỢ.docx — mục 5"

khong-phai-chan-doan:
  title: "Đây không phải một chẩn đoán"
  body: |
    "Cái siêu tôi trừng phạt" là một khái niệm lý thuyết trong phân tâm học,
    không nên trình bày như một chẩn đoán / bệnh độc lập. Vì vậy nên nói "khi
    có biểu hiện của Siêu tôi trừng phạt" hoặc "khi xu hướng tự phê phán mang
    tính trừng phạt trở nên mạnh", thay vì "khi mắc bệnh".

    Những biểu hiện tự trách, đặt tiêu chuẩn cao hay khó chấp nhận sai sót
    là những đặc điểm có thể xuất hiện ở các mức độ khác nhau. Việc nhận diện
    chúng giúp mỗi người hiểu rõ hơn về cách mình đang phản ứng với sai lầm
    và áp lực — không phải để gắn nhãn hay đánh giá một người.

    Bài tự đánh giá cũng vậy: nó giúp bạn nhận diện những đặc điểm liên quan
    đến Cái siêu tôi trừng phạt, không phải công cụ chẩn đoán tâm lý. Kết quả
    phản ánh câu trả lời của bạn tại thời điểm thực hiện và không thay thế cho
    đánh giá của chuyên gia.
  steer: |
    "Siêu tôi trừng phạt" là một CÁCH MÔ TẢ, không phải chẩn đoán y khoa; không
    ai "bị" nó cả. Khi người dùng hỏi "mình có bị gì không", nói thật rằng đây
    không phải chỗ chẩn đoán, rồi quay về đúng điều họ đang trải qua. Không
    trấn an kiểu "không sao đâu" — đó là gạt đi, không phải trả lời.
  source: "HIỂU VỀ CÁI SIÊU TÔI TRỪNG PHẠT.docx — mục 7 · NHẬN DIỆN TRONG ĐỜI SỐNG HỌC SINH.docx — lưu ý cuối"

