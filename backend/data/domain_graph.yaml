# ============================================================================
# CẠNH (edges)
# ============================================================================
edges:
  # --- triggers: Trigger --> Manifestation --------------------------------
  - {from: m-tieu-chuan-cao, to: t-diem-so, type: triggers}   # tiêu chuẩn cao → dễ "không đạt"
  - {from: t-diem-so, to: m-tu-trach, type: triggers}
  - {from: t-diem-so, to: m-dang-bi-trach-phat, type: triggers}
  - {from: t-diem-so, to: m-chi-nho-loi-sai, type: triggers}
  - {from: t-ky-vong-gia-dinh, to: m-co-loi-ky-vong, type: triggers}
  - {from: t-ky-vong-gia-dinh, to: m-phai-hoan-hao, type: triggers}
  - {from: t-so-sanh-ban-be, to: m-chua-du-tot, type: triggers}
  - {from: t-so-sanh-ban-be, to: m-hiem-hai-long, type: triggers}
  - {from: t-thi-cu-tuong-lai, to: m-tieu-chuan-cao, type: triggers}
  - {from: t-thi-cu-tuong-lai, to: m-phai-hoan-hao, type: triggers}

  # --- produces: Manifestation --> Affect --------------------------------
  - {from: m-tu-trach, to: a-toi-loi, type: produces}
  - {from: m-tu-trach, to: a-xau-ho, type: produces}
  - {from: m-dang-bi-trach-phat, to: a-toi-loi, type: produces}
  - {from: m-co-loi-ky-vong, to: a-toi-loi, type: produces}
  - {from: m-xau-ho-khuyet-diem, to: a-xau-ho, type: produces}
  - {from: m-chua-du-tot, to: a-gia-tri-thap, type: produces}
  - {from: m-hiem-hai-long, to: a-gia-tri-thap, type: produces}
  - {from: m-chi-nho-loi-sai, to: a-gia-tri-thap, type: produces}
  - {from: m-phai-hoan-hao, to: a-lo-lang, type: produces}
  - {from: m-tieu-chuan-cao, to: a-lo-lang, type: produces}

  # --- produces: Affect --> Affect (chuỗi trong vòng lặp) ---------------
  - {from: a-toi-loi, to: a-gia-tri-thap, type: produces}
  - {from: a-xau-ho, to: a-gia-tri-thap, type: produces}
  - {from: a-gia-tri-thap, to: a-lo-lang, type: produces}
  - {from: a-gia-tri-thap, to: a-vo-vong, type: produces}

  # --- (MỚI 07/09/2026) tầng đời sống -> affect cơ bản --------------------
  - {from: t-quan-he,  to: a-buon,        type: produces}
  - {from: t-quan-he,  to: a-co-don,      type: produces}
  - {from: t-quan-he,  to: m-chua-du-tot, type: triggers}   # CẦU NỐI DUY NHẤT vào lõi siêu tôi
  - {from: t-ban-be,   to: a-co-don,      type: produces}
  - {from: t-ban-be,   to: a-tuc-gian,    type: produces}
  - {from: t-gia-dinh, to: a-buon,        type: produces}
  - {from: t-gia-dinh, to: a-lo-lang,     type: produces}
  - {from: t-mat-mat,  to: a-buon,        type: produces}
  - {from: t-mat-mat,  to: a-co-don,      type: produces}

  # --- (MỚI) affect cơ bản -> impact --------------------------------------
  - {from: a-buon,     to: i-mat-dong-luc,      type: impairs}
  - {from: a-buon,     to: i-roi-loan-giac-ngu, type: impairs}
  - {from: a-buon,     to: i-kho-tap-trung,     type: impairs}
  - {from: a-co-don,   to: i-thu-minh,          type: impairs}
  - {from: a-tuc-gian, to: i-kho-tap-trung,     type: impairs}

  # --- (MỚI) affect cơ bản -> affect lõi ----------------------------------
  #     Hai cạnh này CÓ CHỦ ĐÍCH thưa. Buồn KHÔNG mặc nhiên là siêu tôi trừng
  #     phạt; chỉ khi nó kéo dài tới vô vọng, hoặc khi cơn giận quay vào trong
  #     thành tội lỗi, thì mới chạm lõi.
  - {from: a-tuc-gian, to: a-toi-loi, type: produces}
  - {from: a-buon,     to: a-vo-vong, type: produces}

  # --- impairs: Affect --> Impact -------------------------------------
  - {from: a-lo-lang, to: i-kho-tap-trung, type: impairs}
  - {from: a-lo-lang, to: i-roi-loan-giac-ngu, type: impairs}
  - {from: a-gia-tri-thap, to: i-mat-dong-luc, type: impairs}
  - {from: a-gia-tri-thap, to: i-thu-minh, type: impairs}
  - {from: a-xau-ho, to: i-ne-tranh, type: impairs}
  - {from: a-toi-loi, to: i-ne-tranh, type: impairs}
  - {from: a-vo-vong, to: i-mat-dong-luc, type: impairs}

  # --- reinforces: Impact --> Manifestation + cạnh đóng vòng lặp -------
  - {from: a-lo-lang, to: m-phai-hoan-hao, type: reinforces}   # cạnh đóng vòng lặp (docx/02 §7)
  - {from: m-phai-hoan-hao, to: m-tu-trach, type: reinforces}  # quay về đầu
  - {from: i-ne-tranh, to: m-dang-bi-trach-phat, type: reinforces}
  - {from: i-mat-dong-luc, to: m-chua-du-tot, type: reinforces}
  - {from: i-kho-tap-trung, to: m-tu-trach, type: reinforces}

  # --- explained_by: Manifestation --> Concept ------------------------
  - {from: m-tu-trach, to: c-lanh-manh-vs-trung-phat, type: explained_by}
  - {from: m-kho-tha-thu, to: c-lanh-manh-vs-trung-phat, type: explained_by}
  - {from: m-tieu-chuan-cao, to: c-lanh-manh-vs-trung-phat, type: explained_by}
  - {from: m-phai-hoan-hao, to: c-id-ego-superego, type: explained_by}
  - {from: m-dang-bi-trach-phat, to: c-vong-lap-tu-phe-phan, type: explained_by}
  - {from: m-chua-du-tot, to: c-khong-phai-chan-doan, type: explained_by}

  # --- explained_by: chủ đề 3 (09/09/2026) — Impact --> Concept -----------
  # Đây là cách "khi học sinh nói cụ thể thì lý thuyết tự lên" (yêu cầu khách
  # 09/09): KHÔNG bày chip, mà để gate SUPPORT kéo thẻ triệu chứng lên khi một
  # node IMPACT (chức năng đã bị ảnh hưởng) đã CONFIRMED — tức hệ thống ĐÃ có
  # bằng chứng, không phải học sinh tò mò bấm.
  #
  # CỐ Ý chỉ móc từ node IMPACT, KHÔNG từ affect lõi (a-lo-lang, a-buon): hai
  # affect đó nằm trong vòng lặp siêu tôi và dùng chung mọi chủ đề — móc vào
  # sẽ đổi {THEORY_CONTENT} của cả chủ đề 1, 2 (docx/13 §11).
  #   né tránh bài tập / kiểm tra   -> "rối loạn lo âu biểu hiện ra sao"
  #   mất động lực · thu mình       -> "trầm cảm biểu hiện ra sao"
  - {from: i-ne-tranh, to: c-dau-hieu-lo-au, type: explained_by}
  - {from: i-mat-dong-luc, to: c-dau-hieu-tram-cam, type: explained_by}
  - {from: i-thu-minh, to: c-dau-hieu-tram-cam, type: explained_by}

  # --- addressed_by: POLICY EDGE (8) — thứ giết "sáo rỗng" -----------
  #     Luật chọn: priority cao nhất thắng; hoà → node có confidence cao hơn.
  - {from: m-tu-trach, to: k-tu-tran-an, type: addressed_by, priority: 30, condition: null}
  - {from: m-kho-tha-thu, to: k-tu-tran-an, type: addressed_by, priority: 28, condition: null}
  - {from: i-ne-tranh, to: k-chia-nho-muc-tieu, type: addressed_by, priority: 25,
     condition: {any_of: [m-dang-bi-trach-phat, a-xau-ho]}}
  - {from: a-lo-lang, to: k-chanh-niem, type: addressed_by, priority: 22,
     condition: {all_of: [i-roi-loan-giac-ngu]}}
  - {from: m-tieu-chuan-cao, to: k-growth-mindset, type: addressed_by, priority: 20, condition: null}
  - {from: m-phai-hoan-hao, to: k-growth-mindset, type: addressed_by, priority: 20, condition: null}
  - {from: m-chi-nho-loi-sai, to: k-ghi-nhan-tich-cuc, type: addressed_by, priority: 18, condition: null}
  - {from: m-hiem-hai-long, to: k-ghi-nhan-tich-cuc, type: addressed_by, priority: 16, condition: null}
  # Nhánh xấu hổ / giá trị bản thân thấp — trước đây KHÔNG có addressed_by nào nên
  # mọi hội thoại đi theo đường này đều rơi về default_coping (nhận diện tự cản trở),
  # lệch hẳn với điều người dùng vừa nói. Lòng trắc ẩn với bản thân mới là cặp đúng.
  - {from: a-gia-tri-thap, to: k-tu-tran-an, type: addressed_by, priority: 26, condition: null}
  - {from: a-xau-ho, to: k-tu-tran-an, type: addressed_by, priority: 24, condition: null}
  - {from: m-chua-du-tot, to: k-tu-tran-an, type: addressed_by, priority: 19, condition: null}

  # (MỚI 07/09/2026) Nhánh đời sống. Thiếu 2 cạnh này thì mọi hội thoại về
  # buồn / tức giận rơi về default_coping = "nhận diện hành vi tự cản trở" —
  # đúng kiểu sáo rỗng lạc đề mà cả thiết kế đang cố tránh.
  # a-co-don CỐ Ý không có coping: cô đơn cần NGƯỜI THẬT, không cần thẻ mẹo.
  # Nó đi đường escalates_to -> s-tu-van-hoc-duong ở dưới.
  - {from: a-buon,     to: k-tu-tran-an, type: addressed_by, priority: 21, condition: null}
  - {from: a-tuc-gian, to: k-chanh-niem, type: addressed_by, priority: 17, condition: null}

  # --- escalates_to: Impact / RiskFlag --> Resource -----------------
  - {from: r-suy-giam-chuc-nang, to: s-ba-me, type: escalates_to}
  - {from: r-suy-giam-chuc-nang, to: s-tu-van-hoc-duong, type: escalates_to}
  - {from: r-keo-dai, to: s-gvcn, type: escalates_to}
  - {from: r-keo-dai, to: s-tu-van-hoc-duong, type: escalates_to}
  - {from: r-y-nghi-tu-hai, to: s-hotline, type: escalates_to}
  - {from: i-thu-minh, to: s-gvcn, type: escalates_to}
  - {from: a-vo-vong, to: s-ba-me, type: escalates_to}
  - {from: a-co-don, to: s-tu-van-hoc-duong, type: escalates_to}   # (MỚI) cô đơn cần người thật

